name: Feature request
description: An idea that would help you make your game.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation in your own work where Loam falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea, in as much or as little detail as you like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
